name: CD Workflow

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_OUTPUT: ${{ github.workspace }}/nuget

on:
  push:
    tags: [v*]
  workflow_dispatch:

jobs:
  ci:
    name: CI Workflow
    uses: ./.github/workflows/ci.yaml

  package:
    name: Package
    runs-on: ubuntu-latest
    
    outputs:
      version: ${{ steps.gitversion.outputs.SemVer }}
      environment: ${{ steps.deployment.outputs.environment }}

    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: .NET Setup
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4
      with:
        versionSpec: '6.x'

    - name: Determine Semantic Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4

    - name: Build
      run: |
        dotnet build -c Release \
        -p:Version=${{ steps.gitversion.outputs.SemVer }} \
        -p:ContinuousIntegrationBuild=true

    - name: Determine Deployment Type
      id: deployment
      shell: bash
      run: |
        if ${{ startsWith(github.ref, 'refs/tags/v') }}; then
          echo "environment=Production" >> "$GITHUB_OUTPUT"
        elif ${{ startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/') }}; then
          echo "environment=Staging" >> "$GITHUB_OUTPUT"
        elif ${{ github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/feature/') }}; then
          echo "environment=Development" >> "$GITHUB_OUTPUT"
        else
          echo "No deployment environment available for: ${{ github.ref }}"
          exit 1
        fi

    - name: Create NuGet Package
      run: | 
        dotnet pack -c Release \
        -o ${{ env.NUGET_OUTPUT }} \
        -p:Version=${{ steps.gitversion.outputs.SemVer }} \
        -p:ContinuousIntegrationBuild=true

    - name: Upload NuGet Package Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.gitversion.outputs.SemVer }}
        path: ${{ env.NUGET_OUTPUT }}
        if-no-files-found: error

  deploy:
    name: Deploy
    needs: [ci, package]
    runs-on: ubuntu-latest

    environment:
      name: ${{ needs.package.outputs.environment }}

    steps:
    - name: Download NuGet Package Artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.package.outputs.version }}
        path: ${{ env.NUGET_OUTPUT }}

    - name: Publish NuGet Package
      run: dotnet nuget push "$NUGET_OUTPUT/*.nupkg" -k "${{ secrets.NUGET_API_KEY }}" -s "${{ vars.NUGET_REPOSITORY }}"